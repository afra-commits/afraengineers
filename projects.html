<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Solar Energy Solutions</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00ff88;
            --secondary: #00d4ff;
            --accent: #ff006e;
            --dark-bg: #0a0e27;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --text-light: #b0c4de;
            --gradient-neon: linear-gradient(135deg, #00ff88 0%, #00d4ff 100%);
            --gradient-dark: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Sora', sans-serif;
            color: var(--text);
            background: var(--gradient-dark);
            background-attachment: fixed;
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(0, 255, 136, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(0, 212, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            top: -50%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(100px);
            animation: float 6s ease-in-out infinite;
            z-index: 0;
        }

        .container {
            max-width: 800px;
            width: 100%;
            padding: 40px 20px;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: slideUp 0.8s ease-out;
        }

        /* Animated Orb */
        .orb {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .orb-1 {
            top: 10%;
            left: -5%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.15) 0%, transparent 70%);
            filter: blur(80px);
            animation: float 8s ease-in-out infinite;
        }

        .orb-2 {
            bottom: 10%;
            right: -5%;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.1) 0%, transparent 70%);
            filter: blur(100px);
            animation: float 10s ease-in-out infinite reverse;
        }

        /* Typography */
        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 4.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -1.5px;
            background: var(--gradient-neon);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 3s ease-in-out infinite, slideDown 0.8s ease-out;
        }

        .subtitle {
            font-size: 1.3rem;
            color: var(--text-light);
            margin-bottom: 50px;
            font-weight: 300;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        /* Countdown Timer */
        .countdown-section {
            margin-bottom: 60px;
            animation: fadeIn 0.8s ease-out 0.4s both;
        }

        .countdown-label {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary);
            margin-bottom: 30px;
            font-weight: 700;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .countdown-item {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 15px;
            padding: 25px 15px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .countdown-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--gradient-neon);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.6s ease;
        }

        .countdown-item:hover::before {
            transform: scaleX(1);
        }

        .countdown-item:hover {
            border-color: rgba(0, 255, 136, 0.4);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.15);
            transform: translateY(-5px);
        }

        .countdown-number {
            font-family: 'Poppins', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .countdown-label-small {
            font-size: 0.75rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            font-weight: 600;
        }

        /* Form Section */
        .form-section {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 20px;
            padding: 50px 40px;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease-out 0.6s both;
        }

        .form-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: var(--text);
            font-weight: 700;
        }

        .form-description {
            font-size: 0.95rem;
            color: var(--text-light);
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .form-input {
            flex: 1;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 30px;
            color: var(--text);
            font-size: 1rem;
            font-family: 'Sora', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-input:focus {
            border-color: var(--primary);
            background: rgba(0, 255, 136, 0.05);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }

        .submit-button {
            padding: 16px 45px;
            background: var(--gradient-neon);
            color: #000;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
            font-family: 'Poppins', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .submit-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s ease;
        }

        .submit-button:hover::before {
            left: 100%;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.5);
        }

        .form-message {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-top: 15px;
        }

        /* Social Links */
        .social-section {
            animation: fadeIn 0.8s ease-out 0.8s both;
        }

        .social-label {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .social-link {
            width: 50px;
            height: 50px;
            background: var(--glass-bg);
            border: 2px solid rgba(0, 255, 136, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 1.3rem;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .social-link::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gradient-neon);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }

        .social-link:hover::before {
            opacity: 1;
        }

        .social-link:hover {
            transform: translateY(-5px) scale(1.1);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.3);
        }

        /* Animations */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(30px);
            }
        }

        @keyframes glow {
            0%, 100% { 
                filter: drop-shadow(0 0 20px rgba(0, 255, 136, 0.3));
            }
            50% { 
                filter: drop-shadow(0 0 40px rgba(0, 255, 136, 0.6));
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1.1rem;
            }

            .countdown-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .countdown-number {
                font-size: 2rem;
            }

            .form-section {
                padding: 40px 25px;
            }

            .form-group {
                flex-direction: column;
            }

            .submit-button {
                width: 100%;
            }

            body::after {
                width: 400px;
                height: 400px;
            }

            .orb-1,
            .orb-2 {
                width: 200px;
                height: 200px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }

            .container {
                padding: 30px 15px;
            }

            .countdown-grid {
                grid-template-columns: 1fr;
            }

            .countdown-item {
                padding: 20px 15px;
            }

            .countdown-number {
                font-size: 1.8rem;
            }

            .form-section {
                padding: 30px 20px;
            }

            .form-title {
                font-size: 1.2rem;
            }

            .social-links {
                gap: 15px;
            }

            .social-link {
                width: 45px;
                height: 45px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="container">
        <!-- Header -->
        <h1>Coming Soon</h1>
        <p class="subtitle">Something amazing is on the way. We're working hard to bring revolutionary solar solutions to you.</p>

        <!-- Countdown Timer -->
        <div class="countdown-section">
            <div class="countdown-label">Launch In</div>
            <div class="countdown-grid">
                <div class="countdown-item">
                    <div class="countdown-number" id="days">45</div>
                    <div class="countdown-label-small">Days</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="hours">12</div>
                    <div class="countdown-label-small">Hours</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="minutes">34</div>
                    <div class="countdown-label-small">Minutes</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="seconds">56</div>
                    <div class="countdown-label-small">Seconds</div>
                </div>
            </div>
        </div>
         <button style="border: #000;border-radius: 10cm;padding: 1cm;"><a style="font-size: larger;" class="countdown-label" href="index.html">Get Back to homepage</a></button>
    </div>

    <script>
        // Countdown Timer
        function updateCountdown() {
            // Set launch date to 45 days from now
            const launchDate = new Date();
            launchDate.setDate(launchDate.getDate() + 45);

            const updateTimer = () => {
                const now = new Date().getTime();
                const distance = launchDate.getTime() - now;

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById('days').textContent = String(days).padStart(2, '0');
                document.getElementById('hours').textContent = String(hours).padStart(2, '0');
                document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
                document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

                if (distance < 0) {
                    document.querySelector('.countdown-label').textContent = 'We\'re Live!';
                }
            };

            updateTimer();
            setInterval(updateTimer, 1000);
        }

        // Form Submission
        function handleSubmit(event) {
            event.preventDefault();
            const input = event.target.querySelector('.form-input');
            const button = event.target.querySelector('.submit-button');
            
            // Store email (in production, send to server)
            console.log('Email submitted:', input.value);
            
            // Visual feedback
            const originalText = button.textContent;
            button.textContent = '✓ Added to waitlist!';
            button.style.opacity = '0.8';
            
            input.value = '';
            
            setTimeout(() => {
                button.textContent = originalText;
                button.style.opacity = '1';
            }, 3000);
        }

        // Initialize
        updateCountdown();
    </script>
</body>
</html>
