<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Enquiry Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:850px;
    background:#efefef;
    padding:40px;
    border-radius:15px;
}

h2{
    margin-bottom:30px;
    font-size:38px;
    font-weight:bold;
}

.row{
    display:flex;
    gap:20px;
    margin-bottom:20px;
}

.row input{
    width:50%;
}

input,
textarea{
    width:100%;
    padding:18px;
    border:none;
    border-radius:10px;
    font-size:18px;
    outline:none;
}

textarea{
    height:200px;
    resize:none;
}

.button{
    text-align:right;
    margin-top:25px;
}

button{
    background:#c40000;
    color:#fff;
    border:none;
    padding:16px 40px;
    font-size:20px;
    border-radius:35px;
    cursor:pointer;
}

button:hover{
    background:#980000;
}

@media(max-width:768px){

.row{
    flex-direction:column;
}

.row input{
    width:100%;
}

.container{
    width:95%;
    padding:20px;
}

}
</style>

</head>
<body>

<div class="container">

<h2>Send Us A Message</h2>

<form onsubmit="sendToWhatsapp(); return false;">

<div class="row">
<input type="text" id="name" placeholder="Your Name" required>

<input type="tel" id="phone" placeholder="Phone Number" required>
</div>

<div class="row">
<input type="email" id="email" placeholder="Email Address*" required>
</div>

<div class="row">
<textarea id="message" placeholder="Your Message" required></textarea>
</div>

<div class="button">
<button type="submit">Submit Now ↗</button>
</div>

</form>

</div>

<script>

function sendToWhatsapp(){

var name=document.getElementById("name").value;
var phone=document.getElementById("phone").value;
var email=document.getElementById("email").value;
var message=document.getElementById("message").value;

// Replace with your WhatsApp Number
var whatsapp="919544812676";

var text =
"New Website Enquiry%0A%0A"+
"Name : "+name+"%0A"+
"Phone : "+phone+"%0A"+
"Email : "+email+"%0A%0A"+
"Message : %0A"+message;

window.open("https://wa.me/"+whatsapp+"?text="+text,"_blank");

}

</script>

</body>
</html>
